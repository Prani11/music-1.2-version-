<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0c0d12">
  <title>Sign in — Sonora</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body.login-page{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 16% 18%,#252345 0,transparent 36%),radial-gradient(ellipse at 85% 82%,#26321e 0,transparent 34%),var(--bg)}
    .login-layout{min-height:100vh;display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,460px);gap:clamp(36px,8vw,130px);align-items:center;width:min(1120px,calc(100% - 64px));margin:auto;padding:54px 0}
    .login-intro{position:relative;min-height:420px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
    .login-brand{display:inline-flex;align-items:center;gap:10px;color:var(--text);text-decoration:none;font:700 26px 'Space Grotesk',sans-serif;letter-spacing:-1.3px}
    .login-brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:var(--accent);color:#171b12;font-size:25px}
    .login-intro-copy{position:relative;z-index:1;margin-top:82px}
    .login-kicker{color:var(--accent);font-size:10px;font-weight:700;letter-spacing:2px}
    .login-intro h1{max-width:560px;margin:15px 0;font:600 clamp(42px,6vw,76px)/1.02 'Space Grotesk',sans-serif;letter-spacing:-4px}
    .login-intro h1 span{color:var(--accent)}
    .login-intro p{max-width:410px;color:#a7a9b7;line-height:1.7}
    .sound-orbit{position:absolute;width:300px;height:300px;right:2%;bottom:2%;border:1px solid #b7ff5a25;border-radius:50%;box-shadow:0 0 100px #b7ff5a0d,inset 0 0 80px #b7ff5a0d}
    .sound-orbit:before,.sound-orbit:after{content:"";position:absolute;inset:32px;border:1px solid #b7ff5a1f;border-radius:50%}
    .sound-orbit:after{inset:75px;background:linear-gradient(145deg,#b7ff5a2b,#b7ff5a02);box-shadow:0 0 60px #b7ff5a12}
    .sound-note{position:absolute;z-index:1;inset:0;display:grid;place-items:center;color:var(--accent);font-size:75px;text-shadow:0 0 40px #b7ff5a88}
    .login-card{position:relative;z-index:2;padding:38px;background:#14151de8;border:1px solid #ffffff12;border-radius:18px;box-shadow:0 30px 90px #0006;backdrop-filter:blur(12px)}
    .login-card h2{margin:0 0 8px;font:600 27px 'Space Grotesk',sans-serif;letter-spacing:-.7px}
    .login-subtitle{margin:0 0 25px;color:#9699a9;font-size:13px}
    .login-tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:23px;padding:4px;border-radius:9px;background:#0e0f15}
    .login-tab{padding:10px;border-radius:7px;background:transparent;color:#8e91a0;font-weight:600;font-size:12px}
    .login-tab.active{background:#242630;color:#fff}
    .login-field{display:block;margin:0 0 16px;color:#c4c6d0;font-size:11px;font-weight:600}
    .login-field input{display:block;width:100%;height:46px;margin-top:8px;padding:0 13px;border:1px solid #30323d;border-radius:8px;background:#0e0f15;color:#f5f5fa;font-size:13px}
    .login-field input::placeholder{color:#666a79}
    .login-options{display:flex;align-items:center;justify-content:space-between;margin:3px 0 21px;color:#9a9dab;font-size:11px}
    .remember-option{display:flex;align-items:center;gap:7px}
    .remember-option input{accent-color:var(--accent)}
    .forgot-link,.login-switch a{color:var(--accent);text-decoration:none}
    .login-submit{width:100%;height:47px;border-radius:8px;background:var(--accent);color:#151910;font-weight:700;transition:transform .15s,filter .15s}
    .login-submit:hover{filter:brightness(1.06);transform:translateY(-1px)}
    .login-divider{display:flex;align-items:center;gap:12px;margin:22px 0;color:#707382;font-size:10px}
    .login-divider:before,.login-divider:after{content:"";height:1px;flex:1;background:#2c2e38}
    .guest-link{display:block;padding:12px;border:1px solid #30323d;border-radius:8px;color:#ddd;text-align:center;text-decoration:none;font-size:12px;font-weight:600}
    .guest-link:hover{border-color:#666a79;background:#ffffff05}
    .login-switch{margin:22px 0 0;color:#9699a9;text-align:center;font-size:11px}
    .login-message{min-height:16px;margin:13px 0 0;color:var(--accent);text-align:center;font-size:11px}
    .login-back{position:absolute;top:25px;left:30px;color:#9b9eac;text-decoration:none;font-size:12px}
    .login-back:hover{color:#fff}
    @media(max-width:820px){.login-layout{grid-template-columns:1fr;width:min(460px,calc(100% - 36px));padding:68px 0 32px}.login-intro{min-height:0}.login-intro-copy{margin-top:30px}.login-intro h1{max-width:460px;font-size:48px;letter-spacing:-2px}.login-intro p{margin-bottom:0}.sound-orbit{width:190px;height:190px;right:-48px;bottom:-74px;opacity:.6}.sound-orbit:before{inset:20px}.sound-orbit:after{inset:50px}.sound-note{font-size:48px}.login-card{padding:28px}}
    @media(max-width:420px){.login-card{padding:23px}.login-intro h1{font-size:40px}.login-layout{width:calc(100% - 28px)}}
  </style>
</head>
<body class="login-page">
  <a class="login-back" href="index.html">← Back to Sonora</a>
  <main class="login-layout">
    <section class="login-intro" aria-label="Welcome to Sonora">
      <div><a class="login-brand" href="index.html"><span class="login-brand-mark">♫</span><span>sonora</span></a></div>
      <div class="login-intro-copy"><span class="login-kicker">YOUR SOUND. YOUR SPACE.</span><h1>Come back to <span>your rhythm.</span></h1><p>Sign in to pick up where the music left off, or create an account to make Sonora yours.</p></div>
      <div class="sound-orbit" aria-hidden="true"><span class="sound-note">♫</span></div>
    </section>
    <section class="login-card" aria-labelledby="formTitle">
      <h2 id="formTitle">Welcome back</h2>
      <p class="login-subtitle" id="formSubtitle">Sign in to your Sonora account</p>
      <div class="login-tabs" role="tablist" aria-label="Account access">
        <button class="login-tab active" id="signInTab" type="button" role="tab" aria-selected="true">Sign in</button>
        <button class="login-tab" id="createTab" type="button" role="tab" aria-selected="false">Create account</button>
      </div>
      <form id="loginForm">
        <label class="login-field" id="nameField" hidden>Your name<input id="nameInput" name="name" type="text" autocomplete="name" placeholder="How should we call you?"></label>
        <label class="login-field">Email address<input name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <label class="login-field">Password<input name="password" type="password" autocomplete="current-password" placeholder="Enter your password" minlength="6" required></label>
        <div class="login-options" id="loginOptions"><label class="remember-option"><input type="checkbox" name="remember"> Keep me signed in</label><a class="forgot-link" href="#" id="forgotLink">Forgot password?</a></div>
        <button class="login-submit" id="submitButton" type="submit">Sign in</button>
        <p class="login-message" id="loginMessage" role="status" aria-live="polite"></p>
      </form>
      <div class="login-divider">OR</div>
      <a class="guest-link" href="index.html">Continue listening as a guest</a>
      <p class="login-switch" id="loginSwitch">New to Sonora? <a href="#" id="switchLink">Create an account</a></p>
    </section>
  </main>
  <script>
    const signInTab = document.querySelector('#signInTab');
    const createTab = document.querySelector('#createTab');
    const nameField = document.querySelector('#nameField');
    const passwordField = document.querySelector('[name="password"]');
    const loginMessage = document.querySelector('#loginMessage');
    let creatingAccount = false;

    function setMode(create) {
      creatingAccount = create;
      signInTab.classList.toggle('active', !create);
      createTab.classList.toggle('active', create);
      signInTab.setAttribute('aria-selected', String(!create));
      createTab.setAttribute('aria-selected', String(create));
      nameField.hidden = !create;
      passwordField.autocomplete = create ? 'new-password' : 'current-password';
      document.querySelector('#formTitle').textContent = create ? 'Create your account' : 'Welcome back';
      document.querySelector('#formSubtitle').textContent = create ? 'Join Sonora and make it yours' : 'Sign in to your Sonora account';
      document.querySelector('#submitButton').textContent = create ? 'Create account' : 'Sign in';
      document.querySelector('#loginOptions').hidden = create;
      document.querySelector('#loginSwitch').innerHTML = create
        ? 'Already have an account? <a href="#" id="switchLink">Sign in</a>'
        : 'New to Sonora? <a href="#" id="switchLink">Create an account</a>';
      loginMessage.textContent = '';
    }

    signInTab.addEventListener('click', () => setMode(false));
    createTab.addEventListener('click', () => setMode(true));
    document.querySelector('#loginSwitch').addEventListener('click', event => {
      if (event.target.id === 'switchLink') { event.preventDefault(); setMode(!creatingAccount); }
    });
    document.querySelector('#forgotLink').addEventListener('click', event => {
      event.preventDefault();
      loginMessage.textContent = 'Password reset will be available when account services are connected.';
    });
    document.querySelector('#loginForm').addEventListener('submit', event => {
      event.preventDefault();
      loginMessage.textContent = creatingAccount
        ? 'Account creation is ready to connect to an authentication service.'
        : 'Sign in is ready to connect to an authentication service.';
    });
  </script>
</body>
</html>
